name: Self-test
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-test:
    # A fork's pull request gets no secrets, and the pull requests the test opens
    # must not start it again.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !startsWith(github.head_ref, 'self-test/')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: self-test/commit-${{ github.run_id }}-${{ github.run_attempt }}
      RESET_BRANCH: self-test/reset-${{ github.run_id }}-${{ github.run_attempt }}
      PR_BRANCH: self-test/pull-request-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          repositories: actions
          permission-contents: write
          permission-pull-requests: write

      - name: Add files
        run: |
          set -euo pipefail
          mkdir self-test
          echo one > self-test/modified.txt
          head -c 3000 /dev/urandom > self-test/binary.bin
          echo gone > self-test/deleted.txt
      - id: add
        uses: ./commit
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ env.BRANCH }}
          base: ${{ github.event.repository.default_branch }}
          message: |
            test: add files

            With a body.
          paths: self-test
      - name: Check the added files
        env:
          SHA: ${{ steps.add.outputs.sha }}
        run: |
          set -euo pipefail
          test -n "$SHA"
          git fetch -q --depth=1 origin "$SHA"
          for f in modified.txt binary.bin deleted.txt; do
            cmp <(git show "$SHA:self-test/$f") "self-test/$f"
          done
          test "$(git log -1 --format=%B "$SHA")" = "$(printf 'test: add files\n\nWith a body.')"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA" --jq .commit.verification.verified)" = true

          # Work on top of the commit, like a job that checked out the branch, while
          # keeping the actions under test in the working tree.
          git reset -q --soft "$SHA"
          echo two > self-test/modified.txt
          rm self-test/deleted.txt
          head -c 6000 /dev/urandom > self-test/large.bin
          echo new > self-test/new.txt
      - id: change
        uses: ./commit
        env:
          COMMIT_MAX_PAYLOAD_BYTES: "4096"
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ env.BRANCH }}
          message: "test: modify, delete and add"
          paths: self-test
      - name: Check the changes
        env:
          BEFORE: ${{ steps.add.outputs.sha }}
          SHA: ${{ steps.change.outputs.sha }}
        run: |
          set -euo pipefail
          test -n "$SHA"
          git fetch -q origin "$SHA"
          test "$(git show "$SHA:self-test/modified.txt")" = two
          cmp <(git show "$SHA:self-test/large.bin") self-test/large.bin
          cmp <(git show "$SHA:self-test/binary.bin") self-test/binary.bin
          test "$(git show "$SHA:self-test/new.txt")" = new
          if git cat-file -e "$SHA:self-test/deleted.txt" 2>/dev/null; then
            exit 1
          fi

          commits=$(git rev-list "$BEFORE..$SHA")
          test "$(echo "$commits" | wc -l)" -gt 1
          for c in $commits; do
            test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$c" --jq .commit.verification.verified)" = true
          done
      - id: unchanged
        uses: ./commit
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ env.BRANCH }}
          message: "test: nothing"
          paths: self-test
      - name: Check that nothing was committed
        env:
          SHA: ${{ steps.unchanged.outputs.sha }}
        run: test -z "$SHA"

      - name: Change files for the reset
        run: echo first > self-test/proposal.txt
      - id: reset-new
        uses: ./commit
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ env.RESET_BRANCH }}
          base: ${{ env.BRANCH }}
          reset: true
          message: "test: reset a new branch"
          paths: self-test
      - name: Change the files again
        env:
          SHA: ${{ steps.reset-new.outputs.sha }}
        run: |
          set -euo pipefail
          test -n "$SHA"
          echo second > self-test/proposal.txt
      - id: reset
        uses: ./commit
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ env.RESET_BRANCH }}
          base: ${{ env.BRANCH }}
          reset: true
          message: "test: reset"
          paths: self-test
      - name: Check the reset
        env:
          SHA: ${{ steps.reset.outputs.sha }}
        run: |
          set -euo pipefail
          test -n "$SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/compare/$BRANCH...$SHA" --jq '"\(.behind_by) \(.ahead_by)"')" = "0 1"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$RESET_BRANCH" --jq .object.sha)" = "$SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA" --jq .commit.verification.verified)" = true
          git fetch -q origin "$SHA"
          test "$(git show "$SHA:self-test/proposal.txt")" = second
          # The temporary branch the reset commits on is gone.
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq "[.[].name | select(startswith(\"$RESET_BRANCH-\"))] | length")" = 0

      - name: Change files for the pull request
        run: echo proposal > self-test/proposal.txt
      - id: open
        uses: ./create-pull-request
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ env.PR_BRANCH }}
          base: ${{ env.BRANCH }}
          title: "test: open"
          body: Opened by the self-test.
          paths: self-test
      - name: Check the pull request
        env:
          CHANGED: ${{ steps.open.outputs.changed }}
          SHA: ${{ steps.open.outputs.sha }}
          NUMBER: ${{ steps.open.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          test "$CHANGED" = true
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" --jq '"\(.head.sha) \(.commits) \(.title)"')" = "$SHA 1 test: open"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA" --jq .commit.verification.verified)" = true

          echo revised > self-test/proposal.txt
      - id: update
        uses: ./create-pull-request
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ env.PR_BRANCH }}
          base: ${{ env.BRANCH }}
          title: "test: update"
          paths: self-test
      - name: Check the updated pull request
        env:
          CHANGED: ${{ steps.update.outputs.changed }}
          SHA: ${{ steps.update.outputs.sha }}
          NUMBER: ${{ steps.open.outputs.pull-request-number }}
          UPDATED: ${{ steps.update.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          test "$CHANGED" = true
          test "$UPDATED" = "$NUMBER"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" --jq '"\(.state) \(.head.sha) \(.commits) \(.title)"')" = "open $SHA 1 test: update"
          git fetch -q origin "$SHA"
          test "$(git show "$SHA:self-test/proposal.txt")" = revised
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA" --jq .commit.verification.verified)" = true
      - id: noop
        uses: ./create-pull-request
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ env.PR_BRANCH }}
          base: ${{ env.BRANCH }}
          title: "test: no-op"
          paths: self-test
      - name: Check that nothing changed
        env:
          CHANGED: ${{ steps.noop.outputs.changed }}
          NUMBER: ${{ steps.open.outputs.pull-request-number }}
          SAME: ${{ steps.noop.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          test "$CHANGED" = false
          test "$SAME" = "$NUMBER"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" --jq .title)" = "test: update"

      - name: Clean up
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NUMBER: ${{ steps.open.outputs.pull-request-number }}
        run: |
          if [ -n "$NUMBER" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" -f state=closed > /dev/null
          fi
          for ref in "$PR_BRANCH" "$RESET_BRANCH" "$BRANCH"; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$ref" > /dev/null || true
          done

  without-commits:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !startsWith(github.head_ref, 'self-test/')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: self-test/without-commits-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: under-test
          persist-credentials: false
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          repositories: actions
          permission-contents: write
                # Generated files for another repository, without a checkout of it.
      - name: Generate files
        run: |
          set -euo pipefail
          git init -q .
          mkdir generated
          echo generated > generated/file.txt
      - id: commit
        uses: ./under-test/commit
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: ${{ github.repository }}
          branch: ${{ env.BRANCH }}
          base: ${{ github.event.repository.default_branch }}
          message: "test: commit without a checkout"
          paths: generated
      - name: Check the commit
        env:
          BASE: ${{ github.event.repository.default_branch }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          test -n "$SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$SHA" --jq '"\(.behind_by) \(.ahead_by) \([.files[].filename] | join(" "))"')" = "0 1 generated/file.txt"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA" --jq .commit.verification.verified)" = true
      - id: again
        uses: ./under-test/commit
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: ${{ github.repository }}
          branch: ${{ env.BRANCH }}
          message: "test: nothing"
          paths: generated
      - name: Check that nothing was committed
        env:
          SHA: ${{ steps.again.outputs.sha }}
        run: test -z "$SHA"
      - name: Clean up
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" > /dev/null || true
